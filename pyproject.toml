[project]
name = "rfp-assistant"
version = "0.1.0"
description = "RAG assistant that drafts answers to RFPs and customer questionnaires from a knowledge base, with a source for every answer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary]>=3",
    "pgvector",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
    "itsdangerous",
    "openai",
    "httpx",
    "python-docx",
    "openpyxl",
    "pypdf",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["kb: runs against the generated knowledge base in data/kb"]

[tool.ruff.lint.per-file-ignores]
# Cyrillic and Kazakh text is the point of these files.
"tests/**" = ["RUF001", "RUF002", "RUF003"]
"scripts/**" = ["RUF001", "RUF002", "RUF003"]
"src/rfp/answering.py" = ["RUF001"]
"src/rfp/documents/language.py" = ["RUF001"]
