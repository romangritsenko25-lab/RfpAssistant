services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp
      POSTGRES_DB: rfp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rfp:rfp@db:5432/rfp
      KB_DIR: /data/kb
    volumes:
      - ./data/kb:/data/kb
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 512m

  # Local model server, optional: docker compose --profile local up -d
  # Then point the app at it in .env (see "Local mode" in .env.example) and pull the models once:
  #   docker compose exec ollama ollama pull qwen2.5:7b
  #   docker compose exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # GPU: uncomment to give the container an NVIDIA GPU (needs the NVIDIA Container Toolkit on the host).
    # Without it the model runs on the CPU, which works but is much slower.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
