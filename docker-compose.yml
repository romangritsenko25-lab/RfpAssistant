services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp
      POSTGRES_DB: rfp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d rfp"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://rfp:rfp@db:5432/rfp
      KB_DIR: /data/kb
    volumes:
      - ./data/kb:/data/kb:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 512m

volumes:
  pgdata:
