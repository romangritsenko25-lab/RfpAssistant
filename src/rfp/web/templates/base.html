<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — RfpAssistant</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx-2.0.4.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="shell">
    <div class="shell__inner">
      <a class="brand" href="/jobs">Rfp<span>Assistant</span></a>
      {% if user %}
      <nav class="nav" aria-label="Основная навигация">
        <a href="/jobs" {% if active == 'jobs' %}aria-current="page"{% endif %}>Опросники</a>
        <a href="/knowledge" {% if active == 'knowledge' %}aria-current="page"{% endif %}>База знаний</a>
        {% if user.is_admin %}<a href="/logs" {% if active == 'logs' %}aria-current="page"{% endif %}>Журналы</a>{% endif %}
      </nav>
      <div class="userbox">
        <span>{{ user.username }}</span>
        <form method="post" action="/logout"><button class="btn btn--ghost" type="submit">Выйти</button></form>
      </div>
      {% endif %}
    </div>
  </header>
  <main id="main" class="page">
    {% if notice %}<div class="msg msg--success" role="status">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
