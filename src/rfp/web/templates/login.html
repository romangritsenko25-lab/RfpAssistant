{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="login">
  <div class="panel"><div class="panel__body">
    <h1>Вход</h1>
    <p class="muted">Сервис заполнения опросников и RFP по базе знаний.</p>
    <form method="post" action="/login">
      {% if error %}<div class="msg msg--error" role="alert">{{ error }}</div>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">Логин</label>
        <input class="input" id="username" name="username" type="text" value="{{ username }}"
               autocomplete="username" autocapitalize="none" required autofocus>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary" type="submit" style="width:100%">Войти</button>
    </form>
  </div></div>
</div>
{% endblock %}
